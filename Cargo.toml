[package]
name = "mcpg-plugin-watch-pubsub"
version = "0.1.0-alpha.5"
license = "Apache-2.0"
edition = "2024"
description = "Google Cloud Pub/Sub watch_strategy plugin for MCPG (dev.mcpg.watch.pubsub) — each message on a subscription as an MCP Event, acknowledged only once the gateway has stored it."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Gate declare_plugin! behind these — an ungated export risks a duplicate
# mcpg_plugin_register symbol if this crate ever links into the workspace
# alongside another exporter.
cdylib-export = []
static-firstparty = []
# Gates the docker-backed emulator suite and the live Google Cloud suite
# (which skips unless PUBSUB_LIVE_* is set) so plain `cargo test` stays cheap.
# Run: `cargo test -p mcpg-plugin-watch-pubsub --features integration-tests`.
integration-tests = []

[dependencies]
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.44", version = "=0.1.0-beta.44" }
mcpg-plugin-sdk = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-beta.45", version = "=0.1.0-beta.45", features = ["static-firstparty"] }
# Pub/Sub over gRPC (yoshidan/google-cloud-rust, the family the BigQuery
# backend uses): rustls TLS, service-account, authorized-user,
# metadata-server and external-account (Workload Identity Federation) auth,
# and the emulator through PUBSUB_EMULATOR_HOST-style endpoints.
gcloud-pubsub = { version = "1", features = ["external-account"] }
# The client's environment (cloud or emulator) and a token source to start
# from, so a stray PUBSUB_EMULATOR_HOST never picks the endpoint.
gcloud-gax = "1"
token-source = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tracing = "0.1"

[dev-dependencies]
# The message type the suite publishes with.
gcloud-googleapis = { version = "1", features = ["pubsub"] }
# The watch's warnings (a failed connect, a refused ack) in a failing run.
tracing-subscriber = "0.3"
testcontainers = "0.27"

tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# The loopback metadata server of the offline credential suite.
wiremock = "0.6"
